claims:
- id: abs-basin
  kind: computation
  passage: Seven corner agents, each knowing its correct pose and predicting every move's effect on itself,
    collectively solve 61 of 3,674,160 states (0.0017 percent), while 758,286 states (20.6 percent) are
    local optima in which no agent consents to move; in 72 percent of states no agent is satisfied, and
    the group's parity makes exactly 6 correct corners impossible.
  evidence:
    file: simulation/output/results.json
    run_id: cube
    pointer: /composition/strict/solved_basin
    reported: '61'
    decimals: 0
    units: states in the solved basin
    conditions: exhaustive over all 3,674,160 fixed-corner pocket-cube states; strict local-correctness
      voting arbiter
