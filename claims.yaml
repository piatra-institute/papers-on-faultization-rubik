- id: zero-signal
  kind: interpretation
  passage: 'The score landscape explains the failure: in 72 percent of all states no agent is satisfied,
    so the signal the collective climbs is absent almost everywhere, and where it exists the climb is
    short.'
  rationale: 72 percent is /composition/score_level_counts/0 = 2,632,650 divided by 3,674,160 states (71.65
    percent), computed from stored counts rather than stored as a separate field.
